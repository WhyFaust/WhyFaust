[package]
name = "whyfaust-profile"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
scraper = "0.24"
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["json", "tls", "native-certs"] }

[profile.release]
strip = true
